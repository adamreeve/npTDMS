[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[project]
name = "npTDMS"
version = "1.13.0"
requires-python = ">=3.11"
description = "Cross-platform, NumPy based module for reading TDMS files produced by LabView"
authors = [{ name = "Adam Reeve", email = "adreeve@gmail.com" }]
readme = "README.rst"
license = "LGPL-3.0-only"
license-files = ["COPYING.LESSER"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
]
dependencies = [
    "numpy",
]

[project.optional-dependencies]
test =[
    # pytest-benchmark 5.3.0 is incompatible with pytest 9.2:
    # https://github.com/ionelmc/pytest-benchmark/issues/321
    "pytest >= 3.1.0, < 9.2",
    "hypothesis",
    "pytest-benchmark",
    "thermocouples_reference",
    "scipy",
]
pandas = [
    "pandas",
    "pyarrow",
]
hdf = [
    "h5py >= 2.10.0",
]
thermocouple_scaling = []

[project.urls]
Documentation = "https://npTDMS.readthedocs.io"
Github = "https://github.com/adamreeve/npTDMS"

[project.scripts]
npTDMS_info = "nptdms.tdmsinfo:main"

[tool.setuptools]
packages = [
    "nptdms",
    "nptdms.export",
    "nptdms.test",
]